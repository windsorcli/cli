name: Claude Code Review
on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_ref:
        required: true
        type: string
permissions:
  contents: read

# The review step only READS the diff and WRITES two files:
#   /tmp/summary-block.md      — sticky summary body (required)
#   /tmp/review-comments.json  — inline findings, JSON array (optional)
# Review jobs hold a read-only token. The publish job runs no model and does
# every GitHub write via main's .github/scripts/publish-review.sh.
#
# Each claude-code-action step below has continue-on-error: true because its
# bundled Agent SDK has a recurring, currently-unresolved crash (is_error:
# true at $0 cost, before any API call) whenever the SDK's own schema drifts
# from what the action assumes on a version bump — confirmed independent of
# model choice and of claude_args (see anthropics/claude-code-action#914,
# #965, #892, #1021). This does not suppress Publish review's own
# exit-1-on-no-summary (intentional, see that step) — it only keeps the
# action step itself from being flagged as a failure distinct from that.
# Remove once upstream ships #1021 (SDK exposing its schema so the action
# can sanitize settings before validation).
jobs:
  review:
    name: Full Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'synchronize' &&
      github.event.pull_request.user.type != 'Bot' &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      !github.event.pull_request.draft
    outputs:
      pr_number: ${{ github.event.pull_request.number }}
      head_sha: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch base ref
        run: git fetch --depth=1 origin ${{ github.base_ref }}
      - uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          GH_REPO: ${{ github.repository }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Review this pull request and produce two output files. Do NOT post
            anything to GitHub yourself — a later CI step publishes what you
            write. Your only job is to write the files.

            Scope strictly to the diff. Read the changed set with
            `git diff "origin/$BASE_REF"...HEAD` (full history is checked out).
            Do NOT read files outside the changed set unless flagging a
            specific, concrete concern. Skip style nits; focus on correctness,
            security, and blast radius.

            ## Output 1 — /tmp/summary-block.md (REQUIRED, always write it)

            A sticky summary of the whole PR as it stands now. Write ONLY the
            callout body — no HTML comment markers, the publish step adds them.
            Exact shape:

              > [!NOTE]
              >
              > **{Low|Medium|High} Risk**
              >
              > {One sentence: what the change affects and why this risk level
              > is appropriate.}
              >
              > **Overview**
              >
              > {2-3 sentences on what the PR does at the highest level — the
              > shape of the change, not a file list.}
              >
              > {Optional second paragraph: the most notable behavioral or
              > structural detail — a rename, a new default, a migration.}

            Tone: calm, specific, prose-first. No emojis, no bullet lists, no
            "Test plan", under ~150 words. Risk level: Low for isolated,
            reversible changes; Medium for shared infra/CLI/workflows or
            changes to defaults; High for security, data-loss, or cross-cutting
            changes. Write this file even when the PR is clean (say it's clean).

            ## Output 2 — /tmp/review-comments.json (optional)

            Inline, line-anchored findings as a JSON array. Omit the file, or
            write `[]`, if there are no line-anchored findings. Each element:

              {
                "path": "relative/path.ext",
                "line": 42,
                "side": "RIGHT",
                "body": "**{title}**\n\n_{Low|Medium|High} Severity_ · `path:line`\n\n{1-3 sentences on what's wrong and the concrete consequence}"
              }

            `line` must be a line present in the PR's current diff or GitHub
            rejects the comment. For a multi-line span add `"start_line"` and
            `"start_side": "RIGHT"`. Title: 4-10 words, imperative or
            declarative, no trailing punctuation. Prefer a few high-signal
            findings over many nits; if a finding can't be line-anchored, fold
            it into the summary instead.

            Write the two files and stop. Do not run `gh`, do not post, do not
            edit the PR.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Write"
            --disallowedTools WebSearch,WebFetch
      - name: Upload review output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-output
          path: |
            /tmp/summary-block.md
            /tmp/review-comments.json
          if-no-files-found: ignore
          retention-days: 1

  review-on-dispatch:
    name: Full Review (on-demand)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    outputs:
      pr_number: ${{ inputs.pr_number }}
      head_sha: ${{ inputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch base ref
        run: git fetch --depth=1 origin ${{ inputs.base_ref }}
      - uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        continue-on-error: true
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
          BASE_REF: ${{ inputs.base_ref }}
          GH_REPO: ${{ github.repository }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: github-actions
          prompt: |
            Review this pull request and produce two output files. Do NOT post
            anything to GitHub yourself — a later CI step publishes what you
            write. Your only job is to write the files.

            Scope strictly to the diff. Read the changed set with
            `git diff "origin/$BASE_REF"...HEAD` (full history is checked out).
            Do NOT read files outside the changed set unless flagging a
            specific, concrete concern. Skip style nits; focus on correctness,
            security, and blast radius.

            ## Output 1 — /tmp/summary-block.md (REQUIRED, always write it)

            A sticky summary of the whole PR as it stands now. Write ONLY the
            callout body — no HTML comment markers, the publish step adds them.
            Exact shape:

              > [!NOTE]
              >
              > **{Low|Medium|High} Risk**
              >
              > {One sentence: what the change affects and why this risk level
              > is appropriate.}
              >
              > **Overview**
              >
              > {2-3 sentences on what the PR does at the highest level — the
              > shape of the change, not a file list.}
              >
              > {Optional second paragraph: the most notable behavioral or
              > structural detail — a rename, a new default, a migration.}

            Tone: calm, specific, prose-first. No emojis, no bullet lists, no
            "Test plan", under ~150 words. Risk level: Low for isolated,
            reversible changes; Medium for shared infra/CLI/workflows or
            changes to defaults; High for security, data-loss, or cross-cutting
            changes. Write this file even when the PR is clean (say it's clean).

            ## Output 2 — /tmp/review-comments.json (optional)

            Inline, line-anchored findings as a JSON array. Omit the file, or
            write `[]`, if there are no line-anchored findings. Each element:

              {
                "path": "relative/path.ext",
                "line": 42,
                "side": "RIGHT",
                "body": "**{title}**\n\n_{Low|Medium|High} Severity_ · `path:line`\n\n{1-3 sentences on what's wrong and the concrete consequence}"
              }

            `line` must be a line present in the PR's current diff or GitHub
            rejects the comment. For a multi-line span add `"start_line"` and
            `"start_side": "RIGHT"`. Title: 4-10 words, imperative or
            declarative, no trailing punctuation. Prefer a few high-signal
            findings over many nits; if a finding can't be line-anchored, fold
            it into the summary instead.

            Write the two files and stop. Do not run `gh`, do not post, do not
            edit the PR.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Write"
            --disallowedTools WebSearch,WebFetch
      - name: Upload review output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-output
          path: |
            /tmp/summary-block.md
            /tmp/review-comments.json
          if-no-files-found: ignore
          retention-days: 1

  resolve-threads:
    name: Resolve Threads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.user.type != 'Bot' &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies') &&
      !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check for unresolved bot threads
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          OWNER="${GH_REPO%/*}"
          REPO="${GH_REPO#*/}"
          COUNT=$(gh api graphql -f query='
            query($owner:String!,$repo:String!,$num:Int!){
              repository(owner:$owner,name:$repo){
                pullRequest(number:$num){
                  reviewThreads(first:100){
                    nodes{
                      isResolved
                      comments(first:1){ nodes{ author{ login } } }
                    }
                  }
                }
              }
            }' -F owner="$OWNER" -F repo="$REPO" -F num="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
                   | select(.isResolved == false)
                   | select(.comments.nodes[0].author.login
                       | test("\\[bot\\]$|^github-actions|^claude$"))]
                   | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Unresolved bot threads: $COUNT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.count != '0'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        if: steps.check.outputs.count != '0'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Your only job is to check whether existing review comments on
            this PR have been addressed and resolve the ones that have.
            Do NOT post new findings or update the PR summary.

            1. List unresolved review threads:

              gh api graphql -f query='
                query($owner:String!,$repo:String!,$num:Int!){
                  repository(owner:$owner,name:$repo){
                    pullRequest(number:$num){
                      reviewThreads(first:100){
                        nodes{
                          id isResolved isOutdated
                          comments(first:1){ nodes{ author{login} path line body } }
                        }
                      }
                    }
                  }
                }' -F owner="${GH_REPO%/*}" -F repo="${GH_REPO#*/}" -F num="$PR_NUMBER"

            2. For each unresolved thread authored by the bot (login ending
               in `[bot]`, `github-actions`, or `claude`):
               - If `isOutdated: true`, resolve it.
               - Otherwise, read the file at the commented path/line and
                 check whether the specific concern is still present.
               - If the issue is fixed, resolve the thread.
               - If a human has replied to the thread, leave it alone.

            3. Resolve via:

              gh api graphql -f query='
                mutation($id:ID!){ resolveReviewThread(input:{threadId:$id}){ thread{ id } } }' \
                -F id="<threadId>"

            That is all. Do not post new comments. Do not modify the PR
            description. Be fast.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools Read,Bash(gh:*),Bash(cat:*),Bash(jq:*)
            --disallowedTools WebSearch,WebFetch

  publish:
    name: Publish Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [review, review-on-dispatch]
    if: >-
      !cancelled() &&
      (needs.review.outputs.head_sha || needs.review-on-dispatch.outputs.head_sha) != ''
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: review-output
          path: /tmp
      - name: Reject output containing credentials
        run: bash .github/scripts/scrub-review.sh
      - name: Publish review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.review.outputs.pr_number || needs.review-on-dispatch.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.review.outputs.head_sha || needs.review-on-dispatch.outputs.head_sha }}
        run: bash .github/scripts/publish-review.sh
