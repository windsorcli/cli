version: v1alpha1
blueprint:
  name: show-artifacts
artifacts:
  - type: docker
    transport: oci
    reference: ghcr.io/example/worker:1.2.3
    source:
      file: kustomize/worker/deployment.yaml
      datasource: docker
  - type: helm
    transport: oci
    reference: cert-manager
    version: 1.16.0
    repository: https://charts.jetstack.io
    source:
      file: kustomize/cert-manager/helm-release.yaml
      datasource: helm
      helmRepo: https://charts.jetstack.io
  - type: helm
    transport: oci
    reference: redis
    version: 20.6.1
    repository: oci://registry-1.docker.io/bitnamicharts
    source:
      file: kustomize/redis/helm-release.yaml
      datasource: helm
      helmRepo: oci://registry-1.docker.io/bitnamicharts
  - type: git-tag
    transport: git
    reference: https://github.com/example/tool
    version: v0.1.0
    source:
      file: terraform/tools/main.tf
      datasource: git-tags
