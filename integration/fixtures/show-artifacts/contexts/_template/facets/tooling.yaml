kind: Facet
apiVersion: blueprints.windsorcli.dev/v1alpha1
metadata:
  name: tooling
  description: Pins a tooling image for the artifact list
config:
  - name: tooling
    value:
      # artifact: type=image name=ghcr.io/example/tooling referrers=false
      image: ghcr.io/example/tooling:2.0.0
  - name: idle
    value:
      # artifact: type=image name=ghcr.io/example/idle
      image: ghcr.io/example/idle:3.0.0
substitutions:
  tooling_image: ${tooling.image}
