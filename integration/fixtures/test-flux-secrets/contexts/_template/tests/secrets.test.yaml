# Secret assertions on a flux system. Composition keeps each data value as
# its authored ${...} expression, so the cases assert that expression.

cases:

  - name: secret_matches_expression
    values: {}
    expect:
      flux:
        - name: registry
          secrets:
            harbor-admin:
              namespaces:
                - system-registry
              data:
                password: ${registry.admin_password}
    exclude:
      flux:
        - name: registry
          secrets:
            harbor-admin:
              data:
                token: ""
            other-secret: {}

  - name: secret_value_mismatch
    values: {}
    expect:
      flux:
        - name: registry
          secrets:
            harbor-admin:
              data:
                password: ${wrong.path}

  - name: secret_excluded_but_present
    values: {}
    exclude:
      flux:
        - name: registry
          secrets:
            harbor-admin: {}
