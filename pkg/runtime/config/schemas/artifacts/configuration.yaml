$schema: https://json-schema.org/draft/2020-12/schema
title: Configuration
description: |
  Settings that the Windsor CLI reads from a context, in the v1alpha2 schema.
  Each context keeps its settings in `contexts/<name>/values.yaml`. The
  blueprint schema in `contexts/_template/schema.yaml` can add more keys. The
  CLI passes those keys to the blueprint. A blueprint schema can declare a key
  from this page, but the key MUST keep the type that this page gives.

  The root `windsor.yaml` holds project-wide settings and no per-context
  values. A v1alpha2 root file MUST hold only these keys:

  | Key | Type | Description |
  |------|------|-------------|
  | `version` | `string` | Config schema version. Set it to `v1alpha2`. |
  | `environment` | `map<string>` | Environment variables that the CLI exports in every context. A key with the same name in the `environment` of a context wins. |
  | `paths.base` | `string` | Directory that holds `contexts/`, relative to the project root. The default is the project root. The path MUST be relative. It MUST NOT contain `..` and MUST NOT be inside `.windsor`. |

  A v1alpha2 root file MUST NOT sit beside a `contexts/<name>/windsor.yaml`.
  Run `windsor migrate` to convert a v1alpha1 project, which keeps
  per-context settings in `windsor.yaml` files.

  ```yaml
  version: v1alpha2
  environment:
    TF_LOG: WARN
  ```
type: object
properties:
  id:
    type: string
    description: |
      Stable identifier for the context, distinct from its directory name. The
      CLI generates one when it is empty. The ID starts with a lowercase
      letter and contains lowercase letters, digits, and single hyphens. It
      has 1 to 63 characters, the DNS label limit.
  platform:
    type: string
    enum:
      - none
      - docker
      - incus
      - metal
      - hetzner
      - aws
      - azure
      - gcp
      - hyperv
      - vsphere
      - proxmox
    description: |
      Platform the context deploys to. The platform selects the platform
      facets of the blueprint. When terraform.backend.type is unset, the
      platform sets the default backend: aws uses s3, azure uses azurerm, gcp
      uses gcs, none uses local, and every other platform uses kubernetes.
  dev:
    type: boolean
    description: |
      Treat the context as a local development context. When the key is
      unset, the CLI treats a context named 'local' or 'local-<name>' as a
      development context.
  environment:
    type: object
    additionalProperties:
      type: string
    description: |
      Environment variables that the CLI exports for the context. Values can
      contain `${...}` expressions, including `secret(...)` references. Keep
      local, git-ignored values in [`.env` files](contexts.md#env-files).
  secrets:
    type: object
    description: Secret providers. The CLI supports SOPS and 1Password.
    properties:
      sops:
        type: object
        properties:
          enabled:
            type: boolean
            description: |
              Decrypt SOPS-encrypted secrets for the context. The CLI then
              resolves 'sops.<key>' references from the 'secrets*.yaml' files
              of the context.
      onepassword:
        type: object
        properties:
          vaults:
            type: object
            additionalProperties:
              type: object
              properties:
                id:
                  type: string
                  description: 1Password vault ID.
                name:
                  type: string
                  description: Vault name. The default is the map key.
                url:
                  type: string
                  description: 1Password instance URL.
            description: 1Password vaults, keyed by the alias that 'op://<alias>/...' references use.
  aws:
    type: object
    description: AWS settings that the CLI exports and checks.
    properties:
      profile:
        type: string
        description: AWS CLI profile for authentication.
      region:
        type: string
        description: AWS region. The CLI exports it as AWS_REGION.
      endpoint_url:
        type: string
        description: Custom AWS endpoint URL.
      mwaa_endpoint:
        type: string
        description: Endpoint for Managed Workflows for Apache Airflow (MWAA).
      s3_hostname:
        type: string
        description: Custom hostname for the S3 service.
  azure:
    type: object
    description: Azure settings that the CLI exports and checks.
    properties:
      environment:
        type: string
        description: Azure cloud name, such as AzurePublicCloud or AzureChinaCloud.
      kubelogin_mode:
        type: string
        description: kubelogin authentication mode, such as 'azurecli' or 'workloadidentity'.
      region:
        type: string
        description: Azure region. The CLI exports it as TF_VAR_region.
      subscription_id:
        type: string
        description: Azure subscription ID.
      tenant_id:
        type: string
        description: Azure tenant ID.
  gcp:
    type: object
    description: GCP settings that the CLI exports.
    properties:
      credentials_path:
        type: string
        description: Path to a GCP service-account credentials JSON file.
      project_id:
        type: string
        description: GCP project ID.
      quota_project:
        type: string
        description: Project that the quota usage bills to.
  vsphere:
    type: object
    description: |
      vCenter connection settings that the CLI exports. The password MUST come
      from secrets or from the environment, never from this file.
    properties:
      server:
        type: string
        description: vCenter server hostname or IP address. The CLI exports it as VSPHERE_SERVER.
      user:
        type: string
        description: vCenter username. The CLI exports it as VSPHERE_USER.
      insecure:
        type: boolean
        description: Do not verify the TLS certificate of vCenter. The CLI exports it as VSPHERE_ALLOW_UNVERIFIED_SSL.
  terraform:
    type: object
    description: Terraform settings of the context.
    properties:
      enabled:
        type: boolean
        description: Apply the terraform components of the blueprint for this context.
      backend:
        type: object
        description: |
          State backend. Windsor passes each field of the selected backend
          block to terraform init. When the type changes on a context that has
          state, windsor plan names the move. windsor apply, up, and bootstrap
          then move the state of each component and verify each copy.
        properties:
          type:
            type: string
            description: Backend type, such as s3, azurerm, gcs, or kubernetes.
          prefix:
            type: string
            description: Prefix of the state key of each component.
          auto_prefix:
            type: boolean
            description: Add <context>-<id>/ after prefix in the state key, so contexts that share a backend keep separate state.
          s3:
            type: object
            properties:
              bucket:
                type: string
          azurerm:
            type: object
            properties:
              container_name:
                type: string
              storage_account_name:
                type: string
          gcs:
            type: object
            properties:
              bucket:
                type: string
          kubernetes:
            type: object
      lock:
        type: object
        properties:
          timeout:
            type: string
            description: |
              How long terraform waits for its own state lock, as a Go
              duration such as '30s' or '5m'. The default is '5m'. Windsor
              passes it as -lock-timeout to each terraform subcommand that
              touches state. For the Windsor stack lock, see the global
              --lock-timeout flag.
  workstation:
    type: object
    description: Local workstation settings.
    properties:
      runtime:
        type: string
        enum:
          - colima
          - docker-desktop
          - docker
        description: Host runtime for local clusters. colima and docker-desktop run a VM. docker uses the Docker engine directly.
      address:
        type: string
        description: Workstation address. The CLI uses it for SSH to configure workstation networking.
      arch:
        type: string
        enum:
          - amd64
          - arm64
        description: CPU architecture. The default is the host architecture.
      dns:
        type: object
        properties:
          address:
            type: string
            description: DNS server address that the workstation infrastructure supplies.
  dns:
    type: object
    description: DNS settings.
    properties:
      domain:
        type: string
        description: Primary DNS domain of the context, such as 'example.test'.
      enabled:
        type: boolean
        description: Turn DNS on or off for the context. When it is not false and a workstation runtime is set, the default domain is 'test'.
  network:
    type: object
    description: Cluster network settings.
    properties:
      cidr_block:
        type: string
        description: CIDR block of the cluster network.
      loadbalancer_ips:
        type: object
        description: IP address range for load-balancer services.
        properties:
          start:
            type: string
            description: First IP address of the range, included.
          end:
            type: string
            description: Last IP address of the range, included.
  cluster:
    type: object
    description: Kubernetes cluster settings.
    properties:
      driver:
        type: string
        description: Cluster driver, such as 'talos'.
  docker:
    type: object
    description: Docker settings.
    properties:
      enabled:
        type: boolean
        description: Start the Docker-managed workstation services.
      registry_url:
        type: string
        description: Primary container registry URL.
      registries:
        type: object
        additionalProperties:
          type: object
          properties:
            remote:
              type: string
            local:
              type: string
            hostport:
              type: integer
            endpoint:
              type: string
        description: |
          Deprecated location of the registries map. The CLI reads it when the
          context does not set the top-level registries key, and gives a
          warning. Use the top-level registries key.
  registries:
    type: object
    description: |
      Registries, keyed by upstream registry host. The key '*' applies to each
      host with no entry. An entry with endpoint is a mirror: cluster nodes
      pull the images of its host from the mirror, and the CLI and Flux pull
      the oci:// blueprint sources of its host from the mirror.
    additionalProperties:
      type: object
      properties:
        remote:
          type: string
          description: Upstream registry URL. A registry without one is a local registry.
        local:
          type: string
          description: Upstream host that the entry applies to. The default is the key.
        hostport:
          type: integer
          description: Host port of a local registry.
        endpoint:
          type: string
          description: |
            Mirror of the upstream host, as an optional http or https scheme,
            a host, an optional port, and an optional path. The default scheme
            is https.
  gitops:
    type: object
    description: GitOps settings.
    properties:
      mode:
        type: string
        enum:
          - pull
          - push
        description: GitOps mode. The CLI uses pull for an empty or unknown value.
      namespace:
        type: string
        description: Namespace of the GitOps resources. The default is 'system-gitops'.
examples:
  - platform: aws
    aws:
      region: us-east-1
      profile: staging
    cluster:
      driver: talos
    terraform:
      enabled: true
      backend:
        type: s3
        s3:
          bucket: my-org-tf-state
